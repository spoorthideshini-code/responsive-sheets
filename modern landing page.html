<!DOCTYPE html>
<html>
<head>
<title>Modern Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:80%;
    max-width:900px;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    font-size:50px;
    color:#333;
    margin-bottom:20px;
}
