<!DOCTYPE html>
<html>
<head>
    <title>Profile Card UI</title>
    <style>
        body{
            background-color:#f0f0f0;
            font-family:Arial, sans-serif;
        }

        .card{
            width:300px;
            background:white;
            margin:100px auto;
            padding:20px;
            border:3px solid #333;
            border-radius:10px;
            text-align:center;
        }

        .card img{
            width:120px;
            height:120px;
            border:4px solid #4CAF50;
            border-radius:50%;
            margin-bottom:15px;
        }

        .card h2{
            margin:10px 0;
        }

        .card p{
            padding:10px;
            background:#e8f5e9;
            border:1px solid #4CAF50;
            border-radius:5px;
        }

        .btn{
            display:inline-block;
            margin-top:15px;
            padding:10px 20px;
            background:#4CAF50;
            color:white;
            text-decoration:none;
            border-radius:5px;
            border:2px solid #388E3C;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/120" alt="Profile">
        <h2>spoorthi</h2>
        <p>Web Development Student</p>
        <a href="#" class="btn">Follow</a>
    </div>

</body>
</html>
