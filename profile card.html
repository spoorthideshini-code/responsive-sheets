<!DOCTYPE html>
<html>

<head>
    <title>Profile Card UI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .card {
            width: 300px;
            max-width: 100%;
            background: white;
            margin: 80px auto;
            padding: 20px;
            border: 3px solid #333;
            border-radius: 10px;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .card img {
            width: 120px;
            height: 120px;
            border: 4px solid #4CAF50;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 10px 0;
        }

        .card p {
            padding: 10px;
            background: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 5px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: 2px solid #388E3C;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #388E3C;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tablet View */
        @media screen and (max-width: 768px) {
            .card {
                width: 90%;
            }

            .card h2 {
                font-size: 24px;
            }
        }

        /* Mobile View */
        @media screen and (max-width: 480px) {
            .card {
                width: 100%;
                padding: 15px;
                margin: 40px auto;
            }

            .card img {
                width: 100px;
                height: 100px;
            }

            .card h2 {
                font-size: 22px;
            }

            .card p {
                font-size: 14px;
            }

            .btn {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="https://via.placeholder.com/120" alt="Profile">
        <h2>Spoorthi</h2>
        <p>Web Development Student</p>
        <a href="#" class="btn">Follow</a>
    </div>

</body>

</html>
